name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gdscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Syntax-check GDScript
        run: |
          pip install gdtoolkit
          gdlint engine/ || true
          gdformat --check engine/ || true
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Compile tools
        run: python -m py_compile tools/tile_previewer.py
  rust:
    runs-on: ubuntu-latest
    if: hashFiles('data/pipeline/Cargo.toml') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path data/pipeline/Cargo.toml
